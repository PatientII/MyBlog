<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人博客系统 - 注册</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#3b82f6', secondary: '#64748b', dark: '#1e293b', light: '#f1f5f9' },
          fontFamily: { inter: ['Inter', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto { content-visibility: auto; }
      .bg-gradient-custom { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
      .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
      .input-focus { @apply focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none; }
      .btn-hover { @apply hover:shadow-lg hover:-translate-y-0.5 transition-all duration-300; }
    }
  </style>
</head>
<body class="font-inter bg-gray-100 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-6xl grid md:grid-cols-2 gap-8">
  <div class="hidden md:block bg-gradient-custom rounded-2xl p-12 text-white flex flex-col justify-center card-shadow">
    <div class="mb-8">
      <h1 class="text-[clamp(2rem,5vw,3rem)] font-bold mb-4">个人博客系统</h1>
      <p class="text-blue-100 text-lg">创建账号，开始你的博客之旅</p>
    </div>
    <div class="space-y-6 mt-12">
      <div class="flex items-start">
        <div class="bg-white/20 p-3 rounded-full mr-4"><i class="fa fa-user-plus text-xl"></i></div>
        <div><h3 class="text-xl font-semibold mb-1">快速注册</h3><p class="text-blue-100">简单几步，即可拥有自己的博客账号</p></div>
      </div>
      <div class="flex items-start">
        <div class="bg-white/20 p-3 rounded-full mr-4"><i class="fa fa-shield text-xl"></i></div>
        <div><h3 class="text-xl font-semibold mb-1">安全保障</h3><p class="text-blue-100">账号信息加密存储，保障你的数据安全</p></div>
      </div>
      <div class="flex items-start">
        <div class="bg-white/20 p-3 rounded-full mr-4"><i class="fa fa-pencil-square-o text-xl"></i></div>
        <div><h3 class="text-xl font-semibold mb-1">立即创作</h3><p class="text-blue-100">注册成功后，即可开始发布你的博客文章</p></div>
      </div>
    </div>
  </div>

  <div class="bg-white rounded-2xl p-8 md:p-12 card-shadow">
    <div class="md:hidden mb-8 text-center">
      <h1 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-dark mb-2">个人博客系统</h1>
      <p class="text-secondary">创建你的账号</p>
    </div>
    <div class="mb-8">
      <h2 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-dark">创建账号</h2>
      <p class="text-secondary">请填写以下信息完成注册</p>
    </div>

    <form id="registerForm" class="space-y-6">
      <div>
        <label for="regUsername" class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa fa-user text-gray-400"></i></div>
          <input type="text" id="regUsername" name="regUsername" class="pl-10 w-full rounded-lg border-gray-300 border px-4 py-3 input-focus" placeholder="请输入用户名">
          <div class="hidden error-icon absolute inset-y-0 right-0 pr-3 flex items-center text-red-500"><i class="fa fa-exclamation-circle"></i></div>
        </div>
        <p class="hidden error-message mt-1 text-sm text-red-500">请输入用户名</p>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa fa-envelope text-gray-400"></i></div>
          <input type="email" id="email" name="email" class="pl-10 w-full rounded-lg border-gray-300 border px-4 py-3 input-focus" placeholder="请输入邮箱">
          <div class="hidden error-icon absolute inset-y-0 right-0 pr-3 flex items-center text-red-500"><i class="fa fa-exclamation-circle"></i></div>
        </div>
        <p class="hidden error-message mt-1 text-sm text-red-500">请输入有效的邮箱地址</p>
      </div>

      <div>
        <label for="regPassword" class="block text-sm font-medium text-gray-700 mb-1">密码</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa fa-lock text-gray-400"></i></div>
          <input type="password" id="regPassword" name="regPassword" class="pl-10 w-full rounded-lg border-gray-300 border px-4 py-3 input-focus" placeholder="请输入密码（至少6位）">
          <button type="button" id="toggleRegPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"><i class="fa fa-eye-slash"></i></button>
          <div class="hidden error-icon absolute inset-y-0 right-0 pr-3 flex items-center text-red-500"><i class="fa fa-exclamation-circle"></i></div>
        </div>
        <p class="hidden error-message mt-1 text-sm text-red-500">请输入至少6位的密码</p>
      </div>

      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">确认密码</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa fa-lock text-gray-400"></i></div>
          <input type="password" id="confirmPassword" name="confirmPassword" class="pl-10 w-full rounded-lg border-gray-300 border px-4 py-3 input-focus" placeholder="请再次输入密码">
          <button type="button" id="toggleConfirmPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"><i class="fa fa-eye-slash"></i></button>
          <div class="hidden error-icon absolute inset-y-0 right-0 pr-3 flex items-center text-red-500"><i class="fa fa-exclamation-circle"></i></div>
        </div>
        <p class="hidden error-message mt-1 text-sm text-red-500">两次输入的密码不一致</p>
      </div>

      <button type="submit" class="w-full bg-primary text-white py-3 px-4 rounded-lg font-medium btn-hover">注册</button>
    </form>

    <div class="mt-8 text-center">
      <p class="text-gray-600">已有账号? <a href="login.html" class="text-primary font-medium hover:text-primary/80 transition-colors">立即登录</a></p>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('registerForm');
    const username = document.getElementById('regUsername');
    const email = document.getElementById('email');
    const pwd = document.getElementById('regPassword');
    const confirmPwd = document.getElementById('confirmPassword');
    const togglePwd = document.getElementById('toggleRegPassword');
    const toggleConfirmPwd = document.getElementById('toggleConfirmPassword');

    function togglePwdVis(input, btn) {
      const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
      input.setAttribute('type', type);
      btn.querySelector('i').classList.toggle('fa-eye');
      btn.querySelector('i').classList.toggle('fa-eye-slash');
    }

    togglePwd.addEventListener('click', () => togglePwdVis(pwd, togglePwd));
    toggleConfirmPwd.addEventListener('click', () => togglePwdVis(confirmPwd, toggleConfirmPwd));

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      let valid = true;

      const showErr = (input, msg) => {
        const parent = input.parentElement;
        input.classList.add('border-red-500');
        parent.querySelector('.error-icon')?.classList.remove('hidden');
        parent.nextElementSibling.textContent = msg;
        parent.nextElementSibling.classList.remove('hidden');
        valid = false;
      };

      const hideErr = (input) => {
        const parent = input.parentElement;
        input.classList.remove('border-red-500');
        parent.querySelector('.error-icon')?.classList.add('hidden');
        parent.nextElementSibling.classList.add('hidden');
      };

      if (!username.value.trim()) showErr(username, '请输入用户名');
      else hideErr(username);

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email.value.trim() || !emailRegex.test(email.value.trim())) showErr(email, '请输入有效的邮箱地址');
      else hideErr(email);

      if (!pwd.value.trim() || pwd.value.trim().length < 6) showErr(pwd, '请输入至少6位的密码');
      else hideErr(pwd);

      if (confirmPwd.value.trim() !== pwd.value.trim()) showErr(confirmPwd, '两次输入的密码不一致');
      else hideErr(confirmPwd);

      if (valid) {
        const btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>注册中...';
        setTimeout(() => window.location.href = 'login.html', 1500);
      }
    });

    [username, email, pwd, confirmPwd].forEach(input => {
      input.addEventListener('input', () => hideErr(input));
    });
  });
</script>
</body>
</html>
