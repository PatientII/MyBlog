<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人博客系统 - 登录</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 配置Tailwind自定义颜色和字体 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        dark: '#1e293b',
                        light: '#f1f5f9'
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .bg-gradient-custom {
                background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            }
            .card-shadow {
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            }
            .input-focus {
                @apply focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none;
            }
            .btn-hover {
                @apply hover:shadow-lg hover:-translate-y-0.5 transition-all duration-300;
            }
        }
    </style>
</head>
<body class="font-inter bg-gray-100 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-6xl grid md:grid-cols-2 gap-8">
    <!-- 左侧装饰区域 -->
    <div class="hidden md:block bg-gradient-custom rounded-2xl p-12 text-white flex flex-col justify-center card-shadow">
        <div class="mb-8">
            <h1 class="text-[clamp(2rem,5vw,3rem)] font-bold mb-4">个人博客系统</h1>
            <p class="text-blue-100 text-lg">分享你的想法，记录生活的点滴</p>
        </div>

        <div class="space-y-6 mt-12">
            <div class="flex items-start">
                <div class="bg-white/20 p-3 rounded-full mr-4">
                    <i class="fa fa-pencil text-xl"></i>
                </div>
                <div>
                    <h3 class="text-xl font-semibold mb-1">发布文章</h3>
                    <p class="text-blue-100">轻松创建和编辑你的博客文章，支持富文本编辑</p>
                </div>
            </div>

            <div class="flex items-start">
                <div class="bg-white/20 p-3 rounded-full mr-4">
                    <i class="fa fa-comments text-xl"></i>
                </div>
                <div>
                    <h3 class="text-xl font-semibold mb-1">互动评论</h3>
                    <p class="text-blue-100">与读者进行互动，回复评论，建立自己的社区</p>
                </div>
            </div>

            <div class="flex items-start">
                <div class="bg-white/20 p-3 rounded-full mr-4">
                    <i class="fa fa-folder-open text-xl"></i>
                </div>
                <div>
                    <h3 class="text-xl font-semibold mb-1">分类管理</h3>
                    <p class="text-blue-100">将文章分类整理，让你的博客结构更清晰</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 右侧登录表单 -->
    <div class="bg-white rounded-2xl p-8 md:p-12 card-shadow">
        <div class="md:hidden mb-8 text-center">
            <h1 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-dark mb-2">个人博客系统</h1>
            <p class="text-secondary">请登录你的账号</p>
        </div>

        <div class="mb-8">
            <h2 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-dark">欢迎回来</h2>
            <p class="text-secondary">请输入你的账号信息登录</p>
        </div>

        <!-- 登录表单 -->
        <form id="loginForm" class="space-y-6">
            <!-- 用户名输入 -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa fa-user text-gray-400"></i>
                    </div>
                    <input type="text" id="username" name="username"
                           class="pl-10 w-full rounded-lg border-gray-300 border px-4 py-3 input-focus"
                           placeholder="请输入用户名">
                    <div class="hidden error-icon absolute inset-y-0 right-0 pr-3 flex items-center text-red-500">
                        <i class="fa fa-exclamation-circle"></i>
                    </div>
                </div>
                <p class="hidden error-message mt-1 text-sm text-red-500">请输入用户名</p>
            </div>

            <!-- 密码输入 -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label for="password" class="block text-sm font-medium text-gray-700">密码</label>
                    <a href="#" class="text-sm text-primary hover:text-primary/80 transition-colors">忘记密码?</a>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa fa-lock text-gray-400"></i>
                    </div>
                    <input type="password" id="password" name="password"
                           class="pl-10 w-full rounded-lg border-gray-300 border px-4 py-3 input-focus"
                           placeholder="请输入密码">
                    <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                        <i class="fa fa-eye-slash"></i>
                    </button>
                    <div class="hidden error-icon absolute inset-y-0 right-0 pr-3 flex items-center text-red-500">
                        <i class="fa fa-exclamation-circle"></i>
                    </div>
                </div>
                <p class="hidden error-message mt-1 text-sm text-red-500">请输入密码</p>
            </div>
            <!-- 记住我 -->
            <div class="flex items-center">
                <input type="checkbox" id="rememberMe" name="rememberMe" class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                <label for="rememberMe" class="ml-2 block text-sm text-gray-700">记住我</label>
            </div>
            <!-- 登录按钮 -->
            <button type="submit" class="w-full bg-primary text-white py-3 px-4 rounded-lg font-medium btn-hover">
                登录
            </button>
        </form>
        <!-- 注册提示 -->
        <div class="mt-8 text-center">
            <p class="text-gray-600">还没有账号? <a href="register.html" class="text-primary font-medium hover:text-primary/80 transition-colors">立即注册</a></p>
        </div>
    </div>
</div>
<script>
    // 页面加载完成后执行
    document.addEventListener('DOMContentLoaded', function() {
        const loginForm = document.getElementById('loginForm');
        const username = document.getElementById('username');
        const password = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');

        // 切换密码显示/隐藏
        togglePassword.addEventListener('click', function() {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            // 切换眼睛图标
            const eyeIcon = this.querySelector('i');
            eyeIcon.classList.toggle('fa-eye');
            eyeIcon.classList.toggle('fa-eye-slash');
        });

        // 表单提交
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault(); // 阻止表单默认提交行为
            let isValid = true;

            // 验证用户名
            if (!username.value.trim()) {
                showError(username, '请输入用户名');
                isValid = false;
            } else {
                hideError(username);
            }

            // 验证密码
            if (!password.value.trim()) {
                showError(password, '请输入密码');
                isValid = false;
            } else {
                hideError(password);
            }

            // 验证通过，模拟登录
            if (isValid) {
                const submitBtn = loginForm.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>登录中...';

                // 模拟登录请求，1.5秒后跳转到首页
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            }
        });

        // 输入框输入时验证
        username.addEventListener('input', function() {
            if (this.value.trim()) {
                hideError(this);
            }
        });

        password.addEventListener('input', function() {
            if (this.value.trim()) {
                hideError(this);
            }
        });

        // 显示错误
        function showError(input, message) {
            const parent = input.parentElement;
            const errorIcon = parent.querySelector('.error-icon');
            const errorMessage = parent.nextElementSibling;
            input.classList.add('border-red-500');
            input.classList.remove('border-gray-300');
            if (errorIcon) errorIcon.classList.remove('hidden');
            if (errorMessage) {
                errorMessage.textContent = message;
                errorMessage.classList.remove('hidden');
            }
        }

        // 隐藏错误
        function hideError(input) {
            const parent = input.parentElement;
            const errorIcon = parent.querySelector('.error-icon');
            const errorMessage = parent.nextElementSibling;
            input.classList.remove('border-red-500');
            input.classList.add('border-gray-300');
            if (errorIcon) errorIcon.classList.add('hidden');
            if (errorMessage) errorMessage.classList.add('hidden');
        }
    });
</script>
</body>
</html>
